# .github/workflows/deploy.yml — tag-driven production deploy
#
# Triggers only when a version tag is pushed (e.g. git tag v0.8.0 && git push --tags).
# This makes deploys explicit and auditable: every prod release has a name, and
# merging to main never triggers an irrevocable deploy automatically.
#
# Pipeline:
#   1. Run the full test suite (same as test.yml) — fail fast if tests are red.
#   2. Build the Docker image and push it to Docker Hub tagged with the git tag.
#   3. SSH into the EC2 host, pull the new image, and restart the stack.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub account name
#   DOCKERHUB_TOKEN      — Docker Hub access token (not your login password)
#   EC2_HOST             — public IP or DNS of the EC2 instance
#   EC2_USER             — SSH user (e.g. ubuntu, ec2-user)
#   EC2_SSH_KEY          — private SSH key whose public half is in ~/.ssh/authorized_keys
#   SECRET_KEY           — Flask SECRET_KEY for production
#   GITHUB_CLIENT_ID     — GitHub OAuth app client ID
#   GITHUB_CLIENT_SECRET — GitHub OAuth app client secret
#   EDAMAM_APP_ID        — Edamam API ID (optional; leave empty if unused)
#   EDAMAM_APP_KEY       — Edamam API key (optional; leave empty if unused)

name: Deploy

on:
  push:
    tags:
      - "v*"          # fires on v0.8.0, v1.0.0-rc1, etc. — NOT on branch pushes

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/foodie

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      DATABASE_URL: "sqlite:///:memory:"
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      ENABLE_TEST_LOGIN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run pytest
        run: pytest -v --ignore=tests/test_attack_paths.py
        # attack_paths test requires a live nginx stack; excluded from unit CI.

  # ── 2. Build & push Docker image ──────────────────────────────────────────
  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE }}:latest

  # ── 3. Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
              docker-compose.yml \
              nginx/nginx.conf \
              nginx/proxy_params.conf \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/foodie/

      - name: Deploy on EC2
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.IMAGE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          EDAMAM_APP_ID: ${{ secrets.EDAMAM_APP_ID }}
          EDAMAM_APP_KEY: ${{ secrets.EDAMAM_APP_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "
              set -e
              cd ~/foodie

              # Pull the specific tagged image (pinned version, not just :latest).
              docker pull ${IMAGE}:${TAG}

              # Write a .env file from CI secrets — never committed to the repo.
              cat > .env <<EOF
          SECRET_KEY=${SECRET_KEY}
          GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
          GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
          EDAMAM_APP_ID=${EDAMAM_APP_ID}
          EDAMAM_APP_KEY=${EDAMAM_APP_KEY}
          EOF

              # Override the app image to use the exact tagged version.
              export APP_IMAGE=${IMAGE}:${TAG}

              # Graceful restart: let in-flight requests finish (gunicorn graceful_timeout=30).
              docker compose up -d --no-build \
                  -e DATABASE_URL=postgresql://app:app@db:5432/app

              docker compose ps
              "

      - name: Smoke-test the deployed app
        run: |
          sleep 5
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
              https://${{ secrets.EC2_HOST }}/)
          echo "Home page returned HTTP ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "200" ] || exit 1
