{% extends "base.html" %}

{% block title %}Log in — Foodie{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-5 mx-auto">
        <div class="foodie-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 foodie-page-heading mb-4">Log in</h1>
                <form method="POST" action="{{ url_for('login') }}" data-disable-on-submit>
                    {% if request.args.get('next') %}
                    <input type="hidden" name="next" value="{{ request.args.get('next') }}">
                    {% endif %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autocomplete="username" autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="mb-4 d-flex align-items-center">
                        <input class="form-check-input me-2" type="checkbox" id="remember_me" name="remember_me" value="1">
                        <label class="form-check-label text-muted small" for="remember_me">Remember me for 30 days</label>
                    </div>
                    <button type="submit" class="btn btn-foodie-primary w-100">Log in</button>
                    <a href="{{ url_for('register') }}" class="btn btn-foodie-outline w-100 mt-2">Need an account?</a>
                </form>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="px-2 text-muted small">or</span>
                    <hr class="flex-grow-1">
                </div>

                <a href="{{ url_for('login_github') }}" class="btn btn-dark w-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                         class="bi bi-github me-2" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                                 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                                 -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                                 .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                                 -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
                                 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
                                 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
                                 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    Continue with GitHub
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
