# nginx/nginx.conf — production reverse-proxy config for Foodie
#
# Architecture:
#   Browser  ──HTTPS──►  nginx :443  ──unix socket──►  gunicorn  ──►  Flask
#
# nginx handles: TLS termination, static assets, security headers, rate limiting.
# gunicorn handles: WSGI, worker pool, request multiplexing.
# Flask handles: routes, business logic, DB queries.
#
# This file replaces the full nginx.conf, so it must include the top-level
# `events {}` and `http {}` contexts that nginx requires.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # 10 MB of state; enough for ~160 k unique IPs.
    # Auth endpoints: 5 req/min per IP.  burst=3 allows a few quick retries
    # (e.g. mistyping a password) without triggering the limiter.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstream — the gunicorn unix socket ──────────────────────────────────
    # Both nginx and the app container mount the same named Docker volume at /tmp,
    # so they share the socket file created by gunicorn.
    upstream app {
        server unix:/tmp/gunicorn.sock;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name localhost;

        # TLS — self-signed cert for local/dev; swap for Let's Encrypt in Week 9.
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Only modern TLS; no TLS 1.0/1.1 or SSLv3.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # ── Security headers ─────────────────────────────────────────────────
        # HSTS: browsers remember HTTPS-only for 1 year.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Prevent framing (clickjacking).
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing.
        add_header X-Content-Type-Options "nosniff" always;

        # Don't leak the full referrer URL to external sites.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CSP: allow self + Bootstrap/jsDelivr CDN (used in base.html).
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net;" always;

        # ── Static assets — served directly by nginx ─────────────────────────
        # No round-trip to Python for CSS/JS/images.  30-day browser cache.
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Auth endpoints — rate limited ─────────────────────────────────────
        location /login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        location /register {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Everything else — proxied to gunicorn ─────────────────────────────
        location / {
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    # Catches bare-domain requests (http://localhost) and bounces to HTTPS.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
