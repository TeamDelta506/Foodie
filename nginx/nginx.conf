# nginx/nginx.conf — production reverse-proxy for Foodie
#
# Browser ──HTTPS──► nginx :443 ──unix socket──► gunicorn ──► Flask
#
# Quick start (self-signed cert for local dev):
#   mkdir -p nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout nginx/certs/key.pem -out nginx/certs/cert.pem \
#     -days 365 -subj "/CN=localhost"
#   docker compose up --build
#
# Visit https://localhost (accept the self-signed cert warning).

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Define the upstream — where nginx forwards proxied requests.
    upstream app {
        server unix:/tmp/gunicorn.sock;
        # or: server gunicorn:8000;  if using docker-compose TCP networking
    }

    # Rate limiting zone for auth endpoints (10 MB of state, 5 req/min per IP)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 443 ssl http2;
        server_name yourapp.example.com localhost;

        # TLS configuration
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Security headers — applied to every response
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # Static assets served directly by nginx
        location /static/ {
            alias /app/static/;
            expires 30d;
        }

        # Login endpoint with rate limiting
        location /login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }

        # All other routes — proxied to gunicorn
        location / {
            proxy_pass http://app;
            include /etc/nginx/proxy_params.conf;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name yourapp.example.com localhost;
        return 301 https://$host$request_uri;
    }
}
