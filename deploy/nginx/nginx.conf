# Foodie — main nginx.conf (Week 8: nginx + gunicorn + postgres)
#
# Mounted as /etc/nginx/nginx.conf in docker-compose.prod.yml.
# upstream / limit_req_zone / server must live inside http { }.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream: where nginx forwards proxied requests.
    upstream foodie_app {
        server unix:/tmp/gunicorn.sock;
    }

    # Rate limiting zone for auth endpoints (10 MB of state, 5 req/min per IP)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Allow Bootstrap assets from jsDelivr (templates/base.html).
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https:;" always;

        client_max_body_size 10m;

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location /site/ {
            alias /app/S3_content/;
            expires 7d;
        }

        location = /login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://foodie_app;
            include /etc/nginx/proxy_params.conf;
        }

        location = /login/github {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://foodie_app;
            include /etc/nginx/proxy_params.conf;
        }

        location = /auth/github/callback {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://foodie_app;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://foodie_app;
            include /etc/nginx/proxy_params.conf;
        }
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
