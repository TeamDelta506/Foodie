# docker-compose.yml — the three-container production stack
#
# Browser ──HTTPS──► nginx ──unix socket──► gunicorn ──► Flask ──► Postgres
#
# Generate TLS certs first (see nginx/nginx.conf), then:
#   docker compose up --build

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - gunicorn-socket:/tmp
      - ./static:/app/static:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - gunicorn-socket:/tmp
    environment:
      - DATABASE_URL=postgresql://app:app@db:5432/app
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=1
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

volumes:
  gunicorn-socket:
  pgdata:
