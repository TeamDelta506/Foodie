# docker-compose.yml — Week 8 production stack
#
# Request path:
#   Browser  ──HTTPS :443──►  nginx  ──unix socket──►  gunicorn  ──►  Flask  ──►  Postgres
#
# Three containers, one private docker network, two named volumes.
#
# Quick start:
#   mkdir -p nginx/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout nginx/certs/key.pem -out nginx/certs/cert.pem \
#     -days 365 -subj "/CN=localhost"
#   docker compose up --build
#
# Visit https://localhost (accept the self-signed cert warning in your browser).

services:

  # ── nginx — TLS termination, static assets, rate limiting ────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - gunicorn-socket:/tmp                   # shared unix socket with app
      - ./static:/app/static:ro                # static assets served directly
    depends_on:
      - app
    restart: unless-stopped

  # ── app — gunicorn + Flask ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - gunicorn-socket:/tmp                   # gunicorn writes socket here
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      EDAMAM_APP_ID: ${EDAMAM_APP_ID:-}
      EDAMAM_APP_KEY: ${EDAMAM_APP_KEY:-}
      ENABLE_TEST_LOGIN: ${ENABLE_TEST_LOGIN:-0}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── db — Postgres (not exposed to the host — docker network is the boundary)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 2s
      retries: 10
    # Note: no `ports:` here — db is only reachable from other services on
    # the docker network.  This is the trust boundary described in §6.
    restart: unless-stopped

volumes:
  gunicorn-socket:   # shared between nginx and app; holds the unix socket file
  postgres-data:     # persists database data across container restarts
