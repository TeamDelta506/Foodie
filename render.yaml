# Render Blueprint — Web Service + Postgres for Foodie.
# Deploy: Dashboard → New → Blueprint, or connect repo and use this file.
# Dockerfile: Dockerfile.prod (Gunicorn binds to PORT automatically).

databases:
  - name: foodie-db
    databaseName: foodie
    user: foodie
    plan: free

services:
  - type: web
    name: foodie
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodie-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EDAMAM_APP_ID
        sync: false
      - key: EDAMAM_APP_KEY
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
